<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 310" width="640" role="img" aria-label="Flat nodes with no relationships. Node 2 is expanded to its properties.">
  <title>Flat nodes with no relationships. Node 2 is expanded to its properties.</title>
  <desc>Isolated Flat nodes. Each node stores id and optional extra integers. A TEXT run adds s0, a POINT run adds loc.</desc>
  <defs>
    <marker id="flat-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7781" />
    </marker>
    <marker id="flat-arrow-focus" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da" />
    </marker>
  </defs>
  <circle cx="80.00" cy="56.00" r="16" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" />
  <text x="80.00" y="56.00" text-anchor="middle" dominant-baseline="central" fill="#1f2328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">0</text>
  <circle cx="200.00" cy="56.00" r="16" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" />
  <text x="200.00" y="56.00" text-anchor="middle" dominant-baseline="central" fill="#1f2328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">1</text>
  <circle cx="320.00" cy="56.00" r="16" fill="#0969da" stroke="#1f2328" stroke-width="2" />
  <text x="320.00" y="56.00" text-anchor="middle" dominant-baseline="central" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">2</text>
  <circle cx="440.00" cy="56.00" r="16" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" />
  <text x="440.00" y="56.00" text-anchor="middle" dominant-baseline="central" fill="#1f2328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">3</text>
  <circle cx="560.00" cy="56.00" r="16" fill="#ffffff" stroke="#1f2328" stroke-width="1.5" />
  <text x="560.00" y="56.00" text-anchor="middle" dominant-baseline="central" fill="#1f2328" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">4</text>
  <path d="M 320 72 L 320 96" stroke="#0969da" stroke-width="1.5" fill="none" />
  <rect x="70" y="96" width="500" height="188" rx="8" fill="#ffffff" stroke="#0969da" stroke-width="1.5" />
  <text font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
    <tspan x="90" y="122" fill="#1f2328" font-weight="600">node 2 · label Flat · no relationships</tspan>
    <tspan x="90" y="148" fill="#1f2328">id = 2, then a1 … when ATTRIBUTES &gt; 1</tspan>
    <tspan x="90" y="174" fill="#656d76">TEXT_INDEXES: s0, s1, … = "abcdefghijklmnop"</tspan>
    <tspan x="90" y="198" fill="#656d76">POINT_INDEXES: loc0, loc1, … = point({srid: 7203, x: 1.0, y: 2.0})</tspan>
    <tspan x="90" y="222" fill="#656d76">RANGE_INDEXES: index id, then a1, … (count ≤ ATTRIBUTES)</tspan>
    <tspan x="90" y="254" fill="#656d76">the same counts apply on ring, fanout, and dense ring</tspan>
  </text>
</svg>
