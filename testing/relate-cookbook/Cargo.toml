[package]
name = "relate-cookbook"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Parses the docs/cookbook recipes, runs them against the engine, and checks their recorded outputs (ADR-0130)"
publish = false
license.workspace = true

[features]
default = ["engine"]
# Running recipes needs the engine; parsing and exporting them does not, so
# `cookbook-export` builds fast with `--no-default-features`.
engine = ["dep:relate", "dep:relate-test-support"]

[dependencies]
relate = { workspace = true, optional = true }
relate-formatter = { workspace = true }
relate-splitter = { workspace = true }
relate-test-support = { workspace = true, optional = true }
serde_json = { workspace = true }

[[test]]
name = "recipes"
required-features = ["engine"]
