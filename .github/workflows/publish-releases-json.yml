name: Publish releases.json

# Publishes the static release-discovery document consumed by
# `relate upgrade` / `update` (ADR-0250): the website-root file
# https://relatedb.ai/releases.json, committed to the
# root of the `gh-pages` branch. That branch is the website —
# deploy-pages.yml copies its tree verbatim — and releases.json is
# pipeline-owned there, like install.sh and wasm/ (gh-pages/MAINTAINING.md);
# a hand edit is overwritten by the next release. The file is written by
# this workflow only.
#
# Trigger:
#   - `workflow_call` — chained from release.yml's `publish-releases-json`
#     job, which runs after `release-notes` (the agent-written narrative
#     notes are already prepended to the release body, so releases.json
#     carries them) and after `create-release` (the asset list is complete).
#     Chained explicitly because release.yml publishes via
#     softprops/action-gh-release with the default GITHUB_TOKEN, and GitHub
#     suppresses downstream workflow runs for GITHUB_TOKEN-triggered events
#     (ADR-0265) — a `release: published` trigger here would never fire.
#   - `workflow_dispatch` — manual run: a BACKFILL that regenerates the
#     document from the existing releases without cutting one (ADR-0250 §6).
#     Until the first publisher run the file does not exist and `upgrade`
#     fails with the missing-file error; backfilling the current latest
#     release with this dispatch clears that transition state.
#
# The commit lands on gh-pages and deploy-pages.yml (unchanged — ADR-0250 §1
# says the tree is copied verbatim) publishes it on its next run, the same
# path install.sh takes. Pages deploys are paused (2026-11-05, maintainer
# direction; deploy-pages.yml runs on manual dispatch only): neither a
# release nor a manual backfill deploys the site anymore, so a commit here
# goes live only on a manual deploy-pages.yml dispatch.
#
# The document is a full snapshot recomputed from the live release list on
# every run (ADR-0250 §6), so a backfill needs no inputs and a re-run for
# the same tag is idempotent apart from `generated_at`.
on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag this publish belongs to (commit-message audit trail only; empty on a manual backfill)"
        required: false
        type: string
        default: ""
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Serialize publishes: a release run and a manual backfill would both
    # rewrite releases.json, a conflict push-gh-pages.sh refuses to resolve.
    # The other gh-pages writers touch other files; the push rebases onto
    # them. Job-level (not workflow-level) so it holds for both entry paths —
    # the `workflow_call` chain from release.yml and a manual dispatch.
    concurrency:
      group: publish-releases-json
      cancel-in-progress: false

    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      # The generator reads the live release list and writes the whole
      # document; `main` carries the current script (a backfill dispatch runs
      # from main as well), and only the script directory is needed — the
      # sparse-checkout shape of release.yml's install.sh sync job.
      - name: Checkout main (generator)
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            .github/scripts

      - name: Checkout gh-pages into subdirectory
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      # Same gh-pages checkout + guarded commit + push-gh-pages.sh shape as
      # release.yml's install.sh sync job (ADR-0068): the generator writes
      # straight into the gh-pages checkout, then the commit step below
      # publishes only that file.
      - name: Generate releases.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/publish-releases-json.sh gh-pages/releases.json

      - name: Commit and push releases.json to gh-pages
        env:
          PUBLISH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases.json
          if git diff --cached --quiet; then
            echo "releases.json unchanged; nothing to publish."
            exit 0
          fi
          if [ -n "${PUBLISH_TAG}" ]; then
            subject="chore(website): publish releases.json for ${PUBLISH_TAG}"
          else
            subject="chore(website): publish releases.json"
          fi
          git commit -m "${subject}"
          ../.github/scripts/push-gh-pages.sh .
