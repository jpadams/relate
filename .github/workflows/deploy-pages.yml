name: Deploy Pages

# Publishes https://relatedb.ai/ from three sources:
#   * gh-pages branch — marketing site (index.html, install.sh, wasm/, …)
#     kept in sync by update-website.yml.
#   * examples/wasm-playground/ on main — playground SPA, served under
#     /playground/.
#   * docs/cookbook/ at the latest release tag — cookbook pages built by
#     scripts/cookbook/build.mjs with that tag's wasm bundle, served under
#     /cookbook/ (ADR-0130). A tag without docs/cookbook/
#     publishes no cookbook.
#
# One artifact per deploy; assembled here so all surfaces share a single
# Pages concurrency slot. See gh-pages/MAINTAINING.md.
#
# Prerequisite: repo Settings → Pages → Source must be "GitHub Actions".
#
# PAUSED (2026-11-05, maintainer direction): this workflow runs on manual
# dispatch only — no pipeline trigger. While paused, nothing that writes
# gh-pages (a release's releases.json / install.sh / website page, an
# extension release's extensions.json, a manually dispatched website
# update, a merge to main) goes live until this workflow is run by hand
# from the Actions tab. The pause note at `on:` lists the suspended
# triggers and the restoration recipe.

on:
  # Paused (2026-11-05, maintainer direction): the pipeline triggers are
  # suspended, so the site deploys only when a human runs this workflow
  # from the Actions tab. Suspended:
  #   - `push` to main — merges no longer deploy directly.
  #   - `workflow_call` — release.yml's and release-extensions.yml's
  #     `deploy-pages` jobs (ADR-0330) are removed with their callers;
  #     the gh-pages writers still run and land their commits.
  #   - `workflow_run` of a manually dispatched "Update website" — the
  #     gh-pages commit lands, the deploy does not follow.
  # Restore all three triggers, and the two caller jobs in release.yml /
  # release-extensions.yml, by reverting the pause commit; ADR-0330's
  # chain then applies again as written, and release.yml's self-update
  # smoke returns to chaining after the deploy (its in-script live-site
  # currency gate stays either way).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Job-level (not workflow-level) so one Pages slot serializes every entry
    # path alike, including the `workflow_call` from release.yml.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-src
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2

      - name: Install wasm-bindgen-cli (matches Cargo.lock)
        run: bash scripts/install-wasm-bindgen.sh

      # Pinned release, not apt: Ubuntu's binaryen 108 breaks the bundle's
      # externref table (see scripts/install-binaryen.sh).
      - name: Install binaryen (wasm-opt)
        run: bash scripts/install-binaryen.sh "$RUNNER_TEMP/binaryen" >> "$GITHUB_PATH"

      - name: Build wasm bundle (release)
        run: bash scripts/build-wasm.sh --mode release

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/wasm-playground/package-lock.json

      - name: Build playground
        working-directory: examples/wasm-playground
        env:
          # vite build's manual-chunks pass over the CodeMirror + NVL vendors
          # tips the default 2 GB v8 heap on Ubuntu runners into OOM.
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          npm ci
          npm run build

      # ADR-0130: the cookbook documents shipped behavior only, so it is
      # built from the latest release tag — its recipes, its generator, and
      # its engine — not from main. Runs after the playground build because
      # it may reinstall wasm-bindgen-cli at the tag's version.
      - name: Resolve the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        # Only "no release yet" leaves the cookbook out; any other failure
        # fails the deploy, so a transient API error cannot publish the site
        # without it.
        run: |
          if tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>release.err); then
            :
          elif grep -q 'HTTP 404' release.err; then
            tag=""
          else
            cat release.err >&2
            exit 1
          fi
          echo "latest release: ${tag:-<none>}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout the latest release
        if: steps.release.outputs.tag != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release-src
          fetch-depth: 1

      - name: Build the cookbook from the latest release
        if: steps.release.outputs.tag != ''
        working-directory: release-src
        env:
          TAG: ${{ steps.release.outputs.tag }}
          # Share the compiled dependencies of the main build above.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          # A release from before the cookbook has no docs/cookbook: publish
          # no /cookbook/, the same test the website-update prompt uses to
          # leave the site's Cookbook link out. A release with the cookbook
          # must build it; a missing generator fails the deploy.
          if [[ ! -f docs/cookbook/README.md ]]; then
            echo "$TAG has no docs/cookbook; publishing no /cookbook/"
            exit 0
          fi
          bash "$GITHUB_WORKSPACE/scripts/install-wasm-bindgen.sh" "$PWD"
          bash scripts/build-wasm.sh --mode release
          (cd scripts/cookbook && npm ci)
          # Links to URLs that are not public yet render as text; the build
          # fails on any link that won't resolve. The not-yet-public list is
          # main's lychee.toml, not the tag's (ADR-0133), so publishing a URL
          # takes effect on the next deploy.
          node scripts/cookbook/build.mjs \
            --out "$GITHUB_WORKSPACE/_cookbook" \
            --wasm-dir "$PWD/surfaces/relate-wasm/pkg" \
            --lychee "$GITHUB_WORKSPACE/lychee.toml" \
            --ref "$TAG"

      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          cp -R gh-pages-src _site
          rm -rf _site/.git
          mkdir -p _site/playground
          cp -R examples/wasm-playground/dist/. _site/playground/
          if [[ -d _cookbook ]]; then
            rm -rf _site/cookbook
            mkdir -p _site/cookbook
            cp -R _cookbook/. _site/cookbook/
          fi
          touch _site/.nojekyll
          echo "Assembled site:"
          du -sh _site
          find _site -maxdepth 2 -type d | sort

      - uses: actions/configure-pages@v5

      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
