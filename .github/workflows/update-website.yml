name: Update website

# Keeps the gh-pages site (relatedb.ai) in sync with each
# release: an agent scans CHANGELOG.md and the commits since the last sync
# and surgically updates version references, quickstart, install, examples,
# and reference tabs. Design stays untouched (contract: gh-pages/MAINTAINING.md).

# Trigger (ADR-0129, same cause and fix as ADR-0265 for release-notes.yml):
#   - `workflow_call` — chained from release.yml's update-website job, which
#     runs after Create Release has published the release. The explicit
#     chain replaces the dead `release: [published]` trigger: release.yml
#     publishes via softprops/action-gh-release with the default
#     GITHUB_TOKEN, and GitHub suppresses downstream workflow runs for
#     GITHUB_TOKEN-triggered events — the release trigger never fired
#     (0 runs across v0.8.0-v0.9.1, all published by github-actions[bot]).
#   - `workflow_dispatch` — manual run, unchanged.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

# CI is not a user session: the CLI's anonymous usage metrics
# (ADR-0079) are opted out on every relate spawn a lane of this
# workflow can reach — the released full-bundle binary the update step
# installs and runs (`relate --version`), and any the website-update
# agent runs from it. Reached via workflow_call from release.yml: a
# called workflow does not inherit the caller's env, so the opt-out
# lives here. Workflow-level — the ADR-0255 single-source placement, so
# every lane inherits the identical value.
env:
  DO_NOT_TRACK: "1"

jobs:
  update-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: main
          fetch-depth: 50

      - name: Checkout gh-pages into subdirectory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Install released relate binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # On workflow_dispatch ref_name is a branch (e.g. "main"), not a
          # release tag — fall back to the latest published stable CORE
          # release (vX.Y.Z, the ADR-0250 stable shape): the extension
          # channel publishes its own releases between core ones, and a
          # plugin release carries only tarballs — no relate-linux-amd64
          # asset (LABS-806).
          case "$TAG" in
            v*) ;;
            *) TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
                --json tagName,isDraft,isPrerelease,publishedAt \
                -q '[.[] | select((.isDraft|not) and (.isPrerelease|not) and (.tagName|test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))] | sort_by(.publishedAt) | reverse | .[0].tagName') ;;
          esac
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "relate-linux-amd64" \
            --dir /tmp/relate-release
          mkdir -p "$HOME/.local/bin"
          install -m755 /tmp/relate-release/relate-linux-amd64 "$HOME/.local/bin/relate"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          relate --version

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Install Nexus CLI
        run: |
          set -euo pipefail
          # FireConnect was renamed to Nexus in v0.10.0; the old
          # fw-ai/fireconnect install.sh no longer installs a `fireconnect`
          # binary. No curl|bash: clone the public nexus-cli repo at a
          # pinned, reviewed commit and run install.sh from disk — in repo
          # mode it never fetches code from the network, and the git history
          # makes the executed installer auditable. No secrets in this
          # step's env. Bump the pin deliberately (nexus-cli main,
          # 2026-10-22; installs Nexus v0.10.0).
          NEXUS_SHA=6476726086b2064c8fd04405f6f15d03748fbc14
          git clone --quiet https://github.com/fw-ai/nexus-cli.git "$HOME/.nexus/cli"
          git -C "$HOME/.nexus/cli" checkout --quiet "$NEXUS_SHA"
          bash "$HOME/.nexus/cli/install.sh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          nexus --version

      - name: Route Claude Code through Fireworks
        env:
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$FIREWORKS_API_KEY" ] || { echo "FIREWORKS_API_KEY secret not set"; exit 1; }
          echo "API key present (${#FIREWORKS_API_KEY} chars)"
          # FIREWORKS_API_KEY is only in this step's env — never in the
          # installer's process env. Nexus resolves the key in the order
          # --api-key → FIREWORKS_API_KEY → saved key, so rely on the
          # environment value.
          # FireRouter routes (firerouter/…, auto-instant) are retired and
          # rejected by Nexus — pin the Claude tier slots to concrete
          # -latest aliases instead (they follow new releases on their own).
          nexus claude on --non-interactive \
            --opus kimi-fast-latest \
            --sonnet glm-latest \
            --haiku deepseek-flash-latest
          nexus claude status

      - name: Run website update
        env:
          ENABLE_PROMPT_CACHING_1H: "1"
          # Fresh-HOME auth: Nexus writes the routing env into
          # ~/.claude/settings.json, but a non-onboarded HOME fails Claude
          # Code's login gate before settings env applies ("Not logged in").
          # Process env authenticates directly — the Fireworks
          # Anthropic-compatible gateway accepts the key as a Bearer token.
          ANTHROPIC_BASE_URL: https://api.fireworks.ai/inference
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.FIREWORKS_API_KEY }}
        run: |
          # NOT --bare: bare mode skips ~/.claude/settings.json, which is where
          # Nexus writes the routing env (ANTHROPIC_BASE_URL + the
          # X-Fireworks-Api-Key custom header). With --bare the agent runs
          # unauthenticated ("Not logged in") and silently updates nothing.
          cat .github/prompts/website-update.md \
            | claude \
              -p - \
              --output-format stream-json \
              --verbose \
              --include-partial-messages \
              --no-session-persistence \
              --exclude-dynamic-system-prompt-sections \
              --allowedTools "Bash,Read,Edit,Write" \
              --max-turns 50 \
              --max-budget-usd 2.00 \
            | stdbuf -oL tee /tmp/update-raw.jsonl \
            | jq -r --unbuffered '
                if .type == "assistant" then
                  (.message.content[]? |
                    if .type == "text" then .text
                    elif .type == "tool_use" then
                      "[tool] \(.name) \((.input.command // .input.file_path // "") | .[0:120])"
                    else empty end)
                elif .type == "stream_event" then
                  if .event.type == "content_block_start"
                     and .event.content_block.type == "tool_use" then
                  "[tool] \(.event.content_block.name)"
                  else empty end
                else empty
                end
              ' \
            | stdbuf -oL tee /tmp/update-summary.txt

      - name: Verify the update ran
        run: |
          set -euo pipefail
          # The commit step treats an unchanged tree as success, so a silently
          # unauthenticated or crashed agent must fail here instead.
          if grep -q "Not logged in" /tmp/update-summary.txt 2>/dev/null; then
            echo "::error::Claude Code did not authenticate — Nexus settings were not applied"
            tail -5 /tmp/update-summary.txt || true
            exit 1
          fi
          # Accept "SUMMARY START" too: the v0.9.2 agent emitted the marker
          # with a space despite the prompt showing SUMMARY_START, and the
          # completed update was discarded.
          if ! grep -qE "SUMMARY[_ ]START" /tmp/update-summary.txt 2>/dev/null; then
            echo "::error::the agent produced no summary marker; the update did not run to completion"
            tail -20 /tmp/update-summary.txt 2>/dev/null || true
            exit 1
          fi

      - name: Commit and push
        run: |
          cd gh-pages
          git add -A
          git diff --cached --quiet && {
            echo "No website updates needed for ${{ github.ref_name }}."
            exit 0
          }
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(website): sync with ${{ github.ref_name }}"
          # The release run's other gh-pages writers (install.sh,
          # releases.json) push concurrently; rebase onto them and retry.
          ../.github/scripts/push-gh-pages.sh .
