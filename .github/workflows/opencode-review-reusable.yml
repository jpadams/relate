name: OpenCode Review — Reusable

# Shared body for the three per-skill review checks (ADR-0258). Each kind
# keeps its own caller workflow (opencode-review-{stellar,rust,security}.yml),
# so GitHub still reports three separate checks with independent re-runs;
# this file exists only so the shared steps live in exactly one place.
# Trigger, draft/same-repo if-guard, concurrency, and permissions all live in
# the callers: a workflow_call workflow has no pull_request event of its own,
# and a called workflow can never exceed the caller job's permissions.

on:
  workflow_call:
    inputs:
      review_kind:
        description: 'Exact review-kind marker string (e.g. "Rust review"). Passed to the verdict gate as REVIEW_KIND and used in prompt step names.'
        required: true
        type: string
      prompt_header:
        description: 'Per-kind prompt header file name under .github/prompts/ (e.g. opencode-review-rust.md). Concatenated with opencode-review-protocol.md.'
        required: true
        type: string
      job_name:
        description: 'Lowercase kind label used in step names (e.g. "rust"). The check name itself comes from the caller workflow name and job id.'
        required: true
        type: string
      pipeline:
        description: '"model" (default) posts via the model per opencode-review-protocol.md; "scripted" runs the ADR-0271 deterministic pipeline (facts/scope/brief before, post.py after) and the model only writes .stellar/findings.json.'
        required: false
        type: string
        default: 'model'
      review_timeout_minutes:
        description: 'The model run is capped at this many minutes of wall clock, of which the last three are shutdown headroom (SIGINT grace, kill-after, the timeout marker write) — the model itself gets the rest. A timed-out run never passes: whichever findings document survived posts as a forced-fail partial round, or — if none — the poster reports a distinct timeout reason; the next push or re-run starts a fresh round. Per-kind override knob (LABS-635).'
        required: false
        type: number
        default: 15
    secrets:
      FIREWORKS_API_KEY:
        description: 'Fireworks API key for the review model (ADR-0258; model override per ADR-0302). Must be passed explicitly by each caller.'
        required: true
      # Model overrides (ADR-0302) are declared explicitly instead of
      # `secrets: inherit`: a called workflow sees only these knobs, never
      # every repo secret (least privilege).
      OPENCODE_REVIEW_MODEL:
        description: 'Model override for the review run (ADR-0302). Optional; empty = repo variable, then the built-in default.'
        required: false
      STELLAR_MODEL_STRUCTURE:
        description: 'Stellar structure pass model (ADR-0302); empty = no override.'
        required: false
      STELLAR_MODEL_BRANCHING:
        description: 'Stellar branching pass model (ADR-0302); empty = no override.'
        required: false
      STELLAR_MODEL_BOUNDARIES:
        description: 'Stellar boundaries pass model (ADR-0302); empty = no override.'
        required: false
      STELLAR_MODEL_COMPARISON:
        description: 'Stellar comparison pass model (ADR-0302); empty = no override.'
        required: false

# CI is not a user session: the CLI's anonymous usage metrics
# (ADR-0079) are opted out on every relate spawn a lane of this
# workflow can reach — including any the review agents run on the
# runner while reading the diff. Workflow-level — the ADR-0255
# single-source placement, so every lane inherits the identical value —
# and DO_NOT_TRACK is not a CARGO* var, so the Swatinem/rust-cache
# environment hash is untouched.
env:
  DO_NOT_TRACK: "1"

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Patch CVE-2026-111943 (eMudhra CA compromise)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          # Transient apt/repository flakes killed review rounds silently
          # (the eMudhra lane on #523/#524) — three attempts before this
          # lane gives up (LABS-615).
          for attempt in 1 2 3; do
            if sudo apt-get update && sudo apt-get install --only-upgrade -y ca-certificates; then
              break
            fi
            echo "apt attempt $attempt failed; retrying"
            if [ "$attempt" -eq 3 ]; then
              echo "::error::ca-certificates upgrade failed after 3 attempts"
              exit 1
            fi
            sleep $((attempt * 10))
          done
          sudo update-ca-certificates --fresh
          # Post-condition (remediation assurance): the compromised root
          # must be absent from the rebuilt store -- an on-path attacker
          # replaying validly-signed metadata could otherwise make the
          # upgrade a silent no-op behind a green check. A fixed runner
          # image satisfies this too, so it never false-fails the lane.
          if find /usr/share/ca-certificates /etc/ssl/certs -iname '*emudhra*' -print -quit | grep -q .; then
            echo "::error::eMudhra root still trusted after CA rebuild (CVE-2026-111943)"
            exit 1
          fi
          dpkg-query -W -f='ca-certificates ${Version}' ca-certificates
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Scripted pipelines give the model step no credentials at all:
          # the checkout token is not persisted into .git/config, and the
          # scripted fetches below authenticate per command. (The model
          # runs with shell access; a persisted token would be readable
          # and usable for API writes.)
          persist-credentials: ${{ inputs.pipeline != 'scripted' }}

      - name: Install opencode
        # Pinned install (version + sha256, ADR-0258) lives in the script —
        # the single source shared with release-notes.yml.
        run: .github/scripts/install-opencode.sh

      # Per-pass model overrides (ADR-0302): writes agents.stellar-<pass>.model
      # into the runner's OpenCode config before the model step. Unset vars
      # write no config, so that pass inherits the run-level model.
      - name: Apply stellar pass-model overrides (scripted)
        if: inputs.pipeline == 'scripted'
        env:
          STELLAR_MODEL_STRUCTURE: ${{ secrets.STELLAR_MODEL_STRUCTURE || vars.STELLAR_MODEL_STRUCTURE }}
          STELLAR_MODEL_BRANCHING: ${{ secrets.STELLAR_MODEL_BRANCHING || vars.STELLAR_MODEL_BRANCHING }}
          STELLAR_MODEL_BOUNDARIES: ${{ secrets.STELLAR_MODEL_BOUNDARIES || vars.STELLAR_MODEL_BOUNDARIES }}
          STELLAR_MODEL_COMPARISON: ${{ secrets.STELLAR_MODEL_COMPARISON || vars.STELLAR_MODEL_COMPARISON }}
        run: python3 .agents/skills/stellar-review/tools/pass_models.py

      # Scripted pipeline (stellar, ADR-0271): deterministic facts, ledger
      # and briefs BEFORE the model runs, so the model only judges. The
      # docs-only gate posts the no-op verdict without spending tokens.
      - name: Review facts and scope (scripted)
        if: inputs.pipeline == 'scripted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          .github/scripts/stellar-prep.sh model
          if [ "$(jq -r .has_code_changes .stellar/facts.json)" = "false" ]; then
            python3 .agents/skills/stellar-review/tools/post.py noop --repo "$REPO" --pr "$PR_NUMBER"
          fi

      # The runtime prompt is the per-kind header followed by the shared
      # protocol; concatenated they are equivalent to the pre-split
      # single-file prompts. Scripted pipelines carry their own standalone
      # prompt (posting is scripted, so the shared protocol does not apply).
      - name: Load ${{ inputs.job_name }} prompt into env
        run: |
          {
            echo 'PROMPT<<PROMPT_EOF'
            echo "REPO: ${{ github.repository }}"
            echo "PR NUMBER: ${{ github.event.pull_request.number }}"
            echo "HEAD SHA: ${{ github.event.pull_request.head.sha }}"
            echo
            cat ".github/prompts/${{ inputs.prompt_header }}"
            if [ "${{ inputs.pipeline }}" != "scripted" ]; then
              echo
              cat .github/prompts/opencode-review-protocol.md
            fi
            echo 'PROMPT_EOF'
          } >> "$GITHUB_ENV"

      # Scripted pipelines hand the model NO token: GitHub's && and ||
      # return operands, not booleans, so a one-line expression cannot
      # express this — compute it in shell where the logic is real.
      - name: Compute model-step token (scripted)
        if: inputs.pipeline == 'scripted'
        run: echo 'MODEL_GH_TOKEN=none' >> "$GITHUB_ENV"

      - name: Compute model-step token (model pipeline)
        if: inputs.pipeline != 'scripted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "MODEL_GH_TOKEN=$GH_TOKEN" >> "$GITHUB_ENV"

      - name: Run OpenCode (${{ inputs.job_name }} review)
        # Scripted pipelines skip the model when the deterministic gate
        # already decided (docs-only diff).
        if: env.SCRIPTED_NOOP != 'true'
        env:
          # FIREWORKS_API_KEY must be provisioned as a repo secret (ADR-0258).
          # The model is overridable since ADR-0302: OPENCODE_REVIEW_MODEL
          # resolves secret → repo variable → default. The default is the
          # models.dev catalog router glm-fast-latest, which tracks GLM fast
          # releases; for a reproducible gate, set the override to a pinned
          # catalog model ID (e.g. accounts/fireworks/models/glm-5p3).
          FIREWORKS_API_KEY: ${{ secrets.FIREWORKS_API_KEY }}
          # The inner timeout cap, as a number the shell can do
          # arithmetic on (GitHub expressions cannot): the run block
          # subtracts the shutdown headroom from it.
          REVIEW_TIMEOUT_MINUTES: ${{ inputs.review_timeout_minutes }}
          OPENCODE_REVIEW_MODEL: ${{ secrets.OPENCODE_REVIEW_MODEL || vars.OPENCODE_REVIEW_MODEL || 'fireworks-ai/accounts/fireworks/routers/glm-fast-latest' }}
          # Scripted pipelines post via scripts: the model gets the literal
          # string "none" — an invalid token, so any gh call fails loudly.
          # Model-driven pipelines get the real token for their gh posting.
          GH_TOKEN: ${{ env.MODEL_GH_TOKEN }}
        # The cap (LABS-635): a wedged model must not hold the lane
        # hostage. SIGINT first (a graceful stop can still flush a
        # findings document), kill 60s later; a timed-out run leaves no
        # findings.json and the poster says "timed out", not the generic
        # missing-file reason. The next push or re-run starts fresh.
        #
        # The timeout fact travels as a wrapper-authored marker file in
        # RUNNER_TEMP, never $GITHUB_ENV: the model has shell access and
        # could forge an env var to steer the poster onto the
        # partial-salvage path. The wrapper writes the marker's FINAL
        # state only after the model process has exited, so a forged
        # marker the model dropped mid-run is always clobbered by the
        # authoritative write (OPLANE_REQ-00333784).
        #
        # The inner coreutils cap sits three minutes under the step's
        # own backstop (which shares the input's value — GitHub
        # expressions have no arithmetic, so the headroom is computed
        # here, in the shell that supports it): at equal values
        # GitHub's cancellation races the wrapper's
        # SIGINT-then-kill-then-marker-write sequence and can kill the
        # step first, so the salvage path and the distinct timeout
        # reason never fire (still fail-closed, but always the generic
        # reason). Three minutes cover the SIGINT grace, the 60s
        # kill-after, and the authoritative marker write.
        timeout-minutes: ${{ inputs.review_timeout_minutes }}
        run: |
          MARKER="$RUNNER_TEMP/review_timed_out"
          set +e
          timeout --signal=INT --kill-after=60s \
            "$((REVIEW_TIMEOUT_MINUTES - 3))m" \
            opencode run --model "$OPENCODE_REVIEW_MODEL" "$PROMPT"
          code=$?
          set -e
          if [ "$code" -eq 124 ] || [ "$code" -eq 137 ]; then
            printf '1' > "$MARKER"
          else
            printf '0' > "$MARKER"
          fi
          exit "$code"

      # Scripted pipeline: the poster rolls the ledger, posts one review
      # with all inline comments, derives the verdict, and updates the
      # summary comment. Missing/invalid findings fail closed (ADR-0258).
      # Only .stellar/findings.json is model output: hooks are neutralized
      # (a model-written post-checkout hook fires on the restore), tracked
      # files are reset to HEAD (checkout restores the INDEX, which the
      # model can stage), untracked shadows outside .stellar are removed,
      # PATH is pinned ($GITHUB_PATH poisoning), the noop decision is
      # recomputed here (the model can forge SCRIPTED_NOOP via $GITHUB_ENV
      # to skip this step's cleanup), and facts/scope/ledger are
      # recomputed from git + the trusted summary comment.
      - name: Post review (scripted)
        if: always() && inputs.pipeline == 'scripted'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          STELLAR_RESOLVE: ${{ vars.STELLAR_RESOLVE }}
        run: |
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          set -euo pipefail
          git config --unset core.hooksPath 2>/dev/null || true
          git config --global core.hooksPath /dev/null
          # reset --hard, not checkout --: the model can stage files, and
          # checkout restores from the INDEX; only HEAD is trusted.
          git reset --hard HEAD
          # Remove untracked shadow files outside .stellar, ignored ones
          # included (-x: a gitignored droplet must not survive either —
          # OPLANE_REQ-00333782; a planted .opencode-verdict.txt must NOT
          # survive: it is written below).
          git clean -fdx -- . ':(exclude).stellar'
          .github/scripts/stellar-prep.sh post
          T=.agents/skills/stellar-review/tools
          # The timeout fact is the run step's marker file, written after
          # the model process exited — never an env var the model could
          # have forged into $GITHUB_ENV (OPLANE_REQ-00333784). A missing
          # marker means the run step never reached its wrapper write:
          # no timeout salvage, the generic fail path decides.
          TIMED_OUT=0
          [ -f "$RUNNER_TEMP/review_timed_out" ] \
            && TIMED_OUT=$(cat "$RUNNER_TEMP/review_timed_out")
          # Model output is accepted only as a REGULAR, UNTRACKED file
          # inside .stellar — a symlink (pointing anywhere, runner files
          # included) is deleted before validation and treated as no
          # output, and so is a file tracked at HEAD: a PR force-adding
          # .stellar/findings.json would survive the reset above and
          # pose as model output, steering the poster onto the
          # pass-capable branch (OPLANE_REQ-00333782). The model cannot
          # place a tracked file here — its commits never reach this
          # checkout's HEAD.
          for f in .stellar/findings.json .stellar/findings.partial.json; do
            if [ -L "$f" ] || git ls-files --error-unmatch -- "$f" >/dev/null 2>&1; then
              echo "post: rejecting non-model output $f (symlink or tracked at HEAD) — deleting"
              rm -f "$f"
            fi
          done
          # noop is recomputed here, never trusted from the environment
          if [ "$(jq -r .has_code_changes .stellar/facts.json)" = "false" ]; then
            python3 "$T/post.py" noop --repo "$REPO" --pr "$PR_NUMBER"
            exit 0
          fi
          # The findings-document gate is post.py's check subcommand —
          # one canonical implementation (LABS-615/582), consulted for
          # both the gate decision and the diagnosis: 'valid' + exit 0,
          # or a distinct cause (missing / empty / unparseable JSON /
          # wrong shape) + exit 1 whose message feeds the fail reason
          # below, so a no-findings round names its cause.
          VALID_MSG=$(python3 "$T/post.py" check --findings .stellar/findings.json 2>&1) && VALID=true || VALID=false
          PARTIAL_MSG=$(python3 "$T/post.py" check --findings .stellar/findings.partial.json 2>&1) && PARTIAL=true || PARTIAL=false
          EXTRA=()
          # maintainer escape hatch: repo variable STELLAR_RESOLVE carries
          # one "finding-id:note" resolution for fixes the staleness rules
          # cannot see (auditable, visible in the run log)
          if [ -n "${STELLAR_RESOLVE:-}" ]; then EXTRA+=(--resolve "$STELLAR_RESOLVE"); fi
          # Incremental anchor filter (ADR-0275): the poster drops
          # findings that do not intersect the last_head…head hunks.
          DIFF=()
          if [ -s .stellar/diff-incremental.patch ]; then DIFF=(--diff .stellar/diff-incremental.patch); fi
          if [ "$TIMED_OUT" = "1" ]; then
            # A killed round never greens the gate (LABS-635): whichever
            # document survived — the complete-looking findings.json a
            # graceful SIGINT flush still wrote, or the incremental
            # partial the prompt mandates — posts as a PARTIAL round with
            # the forced-fail verdict, because the passes the run never
            # reached could still hold blockers. Nothing survived and
            # the fail path reports the distinct timeout reason.
            if [ "$VALID" = "true" ]; then
              DOC=.stellar/findings.json
            elif [ "$PARTIAL" = "true" ]; then
              DOC=.stellar/findings.partial.json
            fi
            if [ -n "${DOC:-}" ]; then
              python3 "$T/post.py" post --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" \
                --facts .stellar/facts.json --ledger .stellar/ledger.json \
                --findings "$DOC" --scope .stellar/scope.json \
                --timeout-partial "${DIFF[@]}" "${EXTRA[@]}"
            else
              python3 "$T/post.py" fail --repo "$REPO" --pr "$PR_NUMBER" \
                --reason "review timed out after ${{ inputs.review_timeout_minutes }} minutes (LABS-635) — no findings document was flushed (findings.json: $VALID_MSG; partial: $PARTIAL_MSG); the next push or re-run starts a fresh round"
            fi
          elif [ "$VALID" = "true" ]; then
            python3 "$T/post.py" post --repo "$REPO" --pr "$PR_NUMBER" --head-sha "$HEAD_SHA" \
              --facts .stellar/facts.json --ledger .stellar/ledger.json \
              --findings .stellar/findings.json --scope .stellar/scope.json "${DIFF[@]}" "${EXTRA[@]}"
          else
            python3 "$T/post.py" fail --repo "$REPO" --pr "$PR_NUMBER" \
              --reason "model run produced no valid .stellar/findings.json — $VALID_MSG"
          fi

      - name: Enforce verdict
        # Runs even if the review step fails: a failed review leaves no
        # verdict file and no summary comment, so the gate fails closed
        # instead of skipping green on a dead runner. Scripted pipelines
        # pin PATH and reset the tree first (the model step can poison
        # both).
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_KIND: ${{ inputs.review_kind }}
          VERDICT_FILE: ./.opencode-verdict.txt
        run: |
          if [ "${{ inputs.pipeline }}" = "scripted" ]; then
            export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
            git config --unset core.hooksPath 2>/dev/null || true
            git config --global core.hooksPath /dev/null
            git reset --hard HEAD
          fi
          .github/scripts/enforce-opencode-verdict.sh

      # LABS-615/582: every round's raw documents survive the run even
      # when the posting path dies — the findings documents (full and
      # partial), the verdict file, and the model lanes' staged summary
      # (deleted by the model only AFTER a successful post, so it is
      # captured here exactly when posting failed). A verdict-only or
      # no-findings failure is then diagnosable from the run page
      # instead of guessing from a red X.
      - name: Preserve review outputs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-outputs-${{ inputs.job_name }}
          path: |
            .stellar/findings.json
            .stellar/findings.partial.json
            .opencode-verdict.txt
            .opencode-summary.md
          if-no-files-found: ignore
          retention-days: 14
