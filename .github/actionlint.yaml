# actionlint configuration — auto-discovered from .github/ next to the
# workflows it lints (schema:
# https://github.com/rhysd/actionlint/blob/main/docs/config.md).
#
# The npm publish jobs in release.yml are deliberately disabled pending the
# project licensing decision (the npm section of docs/PUBLISHING.md,
# ADR-0278): their `if: false` switches are the documented "re-enable by
# removing this line" mechanism. The constant-condition finding they raise
# is acknowledged here, scoped to that one file and message — removing the
# switches to satisfy the linter would enable publishing.
paths:
  .github/workflows/release.yml:
    ignore:
      - 'constant expression "false" in condition\. remove the if: section'
